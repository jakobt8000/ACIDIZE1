name: Build macOS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build VST3 + AU
        run: cmake --build build --config Release --target ACIDIZE_VST3 ACIDIZE_AU -j 4

      - name: Sign (ad-hoc) and package
        run: |
          mkdir -p dist
          cp -R build/ACIDIZE_artefacts/Release/VST3/ACIDIZE.vst3 dist/
          cp -R build/ACIDIZE_artefacts/Release/AU/ACIDIZE.component dist/
          codesign --force --deep --sign - dist/ACIDIZE.vst3
          codesign --force --deep --sign - dist/ACIDIZE.component
          cd dist && zip -r -y ../ACIDIZE-mac.zip ACIDIZE.vst3 ACIDIZE.component

      - uses: actions/upload-artifact@v4
        with:
          name: ACIDIZE-mac
          path: ACIDIZE-mac.zip
